name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Compilarea Valgrind din surse dureaza minute. Fara cache de layere,
      # fiecare rulare ar plati din nou pretul asta.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cpp-trace-runner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fiecare exemplu are sursa .cpp si, alaturi, intrarea in .in - aceeasi
      # conventie pe care o va folosi si generarea trace-urilor din AlgPlayground.
      # Ruleaza toate exemplele, apoi raporteaza; nu se opreste la primul esec,
      # ca sa vedem dintr-o rulare care merg si care nu.
      - name: Genereaza si verifica toate exemplele
        run: |
          esec=0
          mkdir -p iesire
          for sursa in exemple/*.cpp; do
            nume=$(basename "$sursa" .cpp)
            intrare=""
            [ -f "exemple/$nume.in" ] && intrare=$(cat "exemple/$nume.in")
            echo "::group::$nume"
            set +e
            docker run --rm -i cpp-trace-runner:ci cli - "$intrare" \
              < "$sursa" > "iesire/$nume.json" 2> "iesire/$nume.stderr"
            cod=$?
            set -e
            tail -3 "iesire/$nume.stderr" || true
            node ci/verifica.mjs "$nume" "iesire/$nume.json" "$cod" "iesire/$nume.stderr" || esec=1
            echo "::endgroup::"
          done
          exit $esec

      - name: Salveaza trace-urile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-uri
          path: iesire/
          if-no-files-found: ignore

      - name: Smoke test - server
        run: |
          docker run -d --name runner -p 8080:8080 cpp-trace-runner:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8080/sanatate && break
            sleep 1
          done
          curl -sf -X POST localhost:8080/trace \
            -H 'content-type: application/json' \
            -d '{"cod":"#include <iostream>\nint main(){int x=7;std::cout<<x;return 0;}","intrare":""}' \
            | head -c 300
          docker rm -f runner

      - name: Log la esec
        if: failure()
        run: docker logs runner || true

      # Log-urile complete de Actions cer autentificare, dar adnotarile se vad
      # public. Cand ceva pica, scoatem diagnosticul prin ::error:: ca sa fie
      # citibil fara login.
      - name: Diagnostic Valgrind
        if: failure()
        run: |
          set +e
          {
            echo "== versiune =="
            docker run --rm --entrypoint valgrind cpp-trace-runner:ci --version
            echo "== flagurile de care depindem =="
            docker run --rm --entrypoint valgrind cpp-trace-runner:ci --help-debug 2>&1 \
              | grep -iE "source-filename|trace-filename|read-var-info" \
              || echo "NU APAR in --help-debug"
            echo "== rulare CLI cu vgtrace brut =="
            docker run --rm -i -e DUMP_VGTRACE=1 cpp-trace-runner:ci \
              cli - "6 1 2 3 1 2 3" < exemple/lista-dublata.cpp 2>&1 >/dev/null
          } > diag.txt 2>&1
          cat diag.txt
          # Adnotarile nu suporta linii noi literale; %0A e forma escapata.
          printf '::error title=Diagnostic::%s\n' \
            "$(head -c 4000 diag.txt | sed -z 's/\n/%0A/g')"

      - name: Salveaza diagnosticul
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic
          path: diag.txt
          if-no-files-found: ignore
