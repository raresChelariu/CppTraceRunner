# Publica imaginea pe ghcr.io si actualizeaza Container App-ul din Azure.
#
# Autentificarea catre Azure se face prin OIDC, fara secrete de lunga durata.
# Pregatirea, o singura data (vezi si DE-VERIFICAT.md):
#
#   az ad app create --display-name gh-cpp-trace-runner
#   az ad sp create --id <appId>
#   az role assignment create --role Contributor --assignee <appId> \
#     --scope /subscriptions/<sub>/resourceGroups/<rg>
#   az ad app federated-credential create --id <appId> --parameters '{
#     "name": "master",
#     "issuer": "https://token.actions.githubusercontent.com",
#     "subject": "repo:<owner>/cpp-trace-runner:ref:refs/heads/master",
#     "audiences": ["api://AzureADTokenExchange"]
#   }'
#
# In GitHub se pun trei *variables* (nu secrets - nu sunt sensibile):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write     # necesar pentru OIDC
  contents: read
  packages: write     # push in ghcr.io

env:
  APP: cpp-trace-runner
  RG: codehelp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pe SHA, nu doar latest: Container Apps creeaza o revizie per imagine,
      # deci rollback-ul e o singura comanda.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizeaza Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "ghcr.io/${{ github.repository }}:${{ github.sha }}"

      - name: Verifica sanatatea
        run: |
          fqdn=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -sf "https://$fqdn/sanatate"; then echo "OK"; exit 0; fi
            sleep 5
          done
          echo "Nu raspunde dupa deploy."
          exit 1
